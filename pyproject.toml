[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tweetharbor"
version = "0.2.0a0"
description = "Evidence-first discovery of important X articles for Codex."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "TweetHarbor Contributors" }
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.scripts]
# StarScout remains available during the 0.2 transition as a GitHub-only
# compatibility command. TweetHarbor is the public product entry point.
tweetharbor = "tweetharbor.cli:app"
starscout = "starscout.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "respx>=0.21",
  "ruff>=0.8",
]
mcp = [
  "mcp>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tweetharbor", "starscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
