[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "starscout"
version = "0.1.0"
description = "AI-driven GitHub repository trend radar."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "StarScout Contributors" }
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.scripts]
starscout = "starscout.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
